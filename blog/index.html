<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Blog</title>
    <meta name="description" content="Parent Book Blog">
    <link rel="stylesheet" href="blog.css">
</head>
<body>
    <header>
        <h1><b>Kids Read for Fun</b></h1>
        <nav>
            <ul>
                <li><a href="#">About</a></li>
                <li><a href="#">Archive</a></li>
                <li><a href="#">Search</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="book-card">
            <!-- Metadata -->
            <div class="metadata">
                <p class="date"><em>July 5, 2022</em></p>
                <p class="age-range">10-14</p>
                <p class="genre">Fantasy</p>
                <div class="rating">
                    <span class="stars" role="img" aria-label="4 out of 5 stars">⭐⭐⭐⭐</span>
                </div>
            </div>
            <!-- Book info -->
            <div class="book-info">
                <h2 class="title">Septimus Heap Book One: Magyk</h2>
                <img class="cover" src="https://upload.wikimedia.org/wikipedia/en/5/5f/Magkycover2.jpg" alt="Cover of Magyk Book 1, by Angie Sage">
                <p class="description">If you enjoy stories about seventh sons of seventh sons and magyk this is the book for you.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Kyler Edwards</p>
    </footer>
</body>
</html>
