<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Ticket</title>
    <meta name="description" content="Event form to get a ticket">
    <script src="eventform.js" defer></script>
    <link rel="stylesheet" href="eventform.css">
    <link rel="shortcut icon" href="images/calendar-favcon.svg" type="image/x-icon">
</head>
<body>
  <main class="wrapper">
    <h1>Event Ticket</h1>

    <form id="fsyForm">
      <div class="field">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" required />
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" required />
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
      </div>

      <div class="field">
        <label for="clientType">Type</label>
        <select
          id="clientType"
          name="clientType"
          aria-controls="notesContainer"
          required
        >
          <option value="">Choose one</option>
          <option value="student">Student</option>
          <option value="guest">Guest</option>
        </select>
      </div>

      <div class="field">
        <label for="eventDate">Event Date</label>
        <input id="eventDate" name="eventDate" type="date" required />
      </div>

      <div id="studentId" class="field full" hidden>
        <label for="id">Student I#</label>
        <input id="id" name="id" type="text" />
      </div>

      <div id="accessCode" class="field full" hidden>
        <label for="code">Access Code</label>
        <input id="code" name="code" type="text" />
      </div>

      <button class="full" type="submit">Create Ticket</button>
    </form>

    <section id="output" aria-live="polite"></section>
  </main>
</body>
</html>
