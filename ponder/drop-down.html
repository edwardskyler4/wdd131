<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop-down-menu</title>
    <meta name="description" content="Ponder activity for a drop-down menu in JS">
    <script src="drop-down.js" defer></script>
    <link rel="stylesheet" href="drop-down.css">
    <style>
        nav > ul {
            display: flex;
            list-style: none;
            padding-left: 0;
            gap: 1em;
        }
        .sub-menu {
            display: none;
        }
        .show {
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <h1>Menu Demo</h1>
        <nav>
            <ul>
                <li><a href="#">Link 1</a>
                    <ul class="sub-menu">
                        <li><a href="#">Sub</a></li>
                        <li><a href="#">Sub</a></li>
                        <li><a href="#">Sub</a></li>
                        <li><a href="#">Sub</a></li>
                    </ul>
                </li>
                <li><a href="#">Link 2</a></li>
                <li><a href="#">Link 3</a></li>
                <li><a href="#">Link 4</a></li>
            </ul>
        </nav>
    </header>

    <main>
        This is the main
    </main>

    <footer>
        This is the footer (empty)
    </footer>
</body>
</html>
